# Builds the Windows installer (see packaging/windows/README.md): on every push to main
# as a check, and on a version tag (v0.3.1) as a GitHub release carrying the installer.
name: Windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Version
        id: version
        run: |
          $v = python -c "import kosmicpdf; print(kosmicpdf.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Kosmic PDF $v"
          if ("${{ github.ref }}".StartsWith("refs/tags/") -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Output "::error::The tag ${{ github.ref_name }} does not match __version__ ($v)"
            exit 1
          }

      - name: Install Python packages
        # requirements.txt without dependencies, as install.sh does: PyMuPDF declares
        # page-layout packages the app never uses. OCRmyPDF brings its own.
        run: |
          python -m pip install --upgrade pip *> pip.log
          python -m pip install --no-deps -r requirements.txt *>> pip.log
          if ($LASTEXITCODE -ne 0) { pwsh packaging/windows/annotate.ps1 pip.log "pip could not install requirements.txt"; exit 1 }
          python -m pip install -r packaging/windows/requirements-build.txt *>> pip.log
          if ($LASTEXITCODE -ne 0) { pwsh packaging/windows/annotate.ps1 pip.log "pip could not install the build requirements"; exit 1 }
          python -m pip list

      - name: Fetch Tesseract and Ghostscript
        run: |
          pwsh packaging/windows/fetch_tools.ps1 *> tools.log
          $code = $LASTEXITCODE
          Get-Content tools.log
          if ($code -ne 0) { pwsh packaging/windows/annotate.ps1 tools.log "Staging Tesseract and Ghostscript failed"; exit 1 }

      - name: Test the code
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $tools = "$PWD\packaging\windows\tools"
          $env:PATH = "$tools\tesseract;$tools\gs\bin;$env:PATH"
          $env:TESSDATA_PREFIX = "$tools\tesseract\tessdata"
          python tests/smoke.py "$env:RUNNER_TEMP\smoke" *> smoke-code.log
          $code = $LASTEXITCODE
          Get-Content smoke-code.log | Select-Object -Last 3
          if ($code -ne 0) { pwsh packaging/windows/annotate.ps1 smoke-code.log "The test suite failed in the Python environment"; exit 1 }

      - name: Build
        run: |
          pyinstaller --noconfirm --clean packaging/windows/kosmicpdf.spec *> pyinstaller.log
          $code = $LASTEXITCODE
          Get-Content pyinstaller.log | Select-Object -Last 20
          if ($code -ne 0) { pwsh packaging/windows/annotate.ps1 pyinstaller.log "PyInstaller failed"; exit 1 }
          if (-not (Test-Path dist\KosmicPDF\tools\tesseract\tesseract.exe)) {
            Write-Host "The spec's Tree() didn't pack the tools; copying them in"
            Copy-Item -Recurse packaging\windows\tools dist\KosmicPDF\tools
          }
          Get-ChildItem dist\KosmicPDF | ForEach-Object { "  $($_.Name)" }
          Get-ChildItem -Recurse dist\KosmicPDF\tools -Include *.exe, *.dll, *.traineddata | ForEach-Object { "  $($_.FullName.Substring($PWD.Path.Length + 1))" }

      - name: Test the built app
        # The same suite, run inside KosmicPDF.exe (see kosmicpdf_entry.py), on the
        # files users get. Each piece has its own time limit, so a hang is reported with
        # the log up to that point rather than killed silently by the job's.
        timeout-minutes: 30
        env:
          QT_QPA_PLATFORM: offscreen
          KOSMICPDF_TEST_INSTALLED: "1"
          KOSMICPDF_SELFTEST: ${{ github.workspace }}\tests\smoke.py
          KOSMICPDF_SELFTEST_LOG: ${{ github.workspace }}\smoke-built.log
        run: |
          function Finished($p, $seconds, $what) {
            if ($p.WaitForExit($seconds * 1000)) { return $true }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host "$what was still running after $seconds s and was killed"
            return $false
          }
          $app = "$PWD\dist\KosmicPDF"
          $env:PATH = "$app;$app\tools\tesseract;$app\tools\gs\bin;$env:PATH"
          $env:TESSDATA_PREFIX = "$app\tools\tesseract\tessdata"

          $p = Start-Process -PassThru -NoNewWindow -FilePath "$app\ocrmypdf.exe" -ArgumentList "--version" -RedirectStandardOutput ocr-version.log -RedirectStandardError ocr-version.err.log
          $ok = Finished $p 180 "ocrmypdf.exe --version"
          Get-Content ocr-version.log, ocr-version.err.log -ErrorAction SilentlyContinue
          if (-not $ok -or $p.ExitCode -ne 0) { pwsh packaging/windows/annotate.ps1 ocr-version.err.log "ocrmypdf.exe --version failed or hung"; exit 1 }

          & "$app\tools\tesseract\tesseract.exe" --version
          & "$app\tools\gs\bin\gswin64c.exe" --version
          $p = Start-Process -PassThru -NoNewWindow -FilePath "$app\ocrmypdf.exe" -ArgumentList "-v", "1", "--use-threads", "-l", "eng", "--output-type", "pdf", "tests\samples\scan.png", "$env:RUNNER_TEMP\ocr-direct.pdf" -RedirectStandardOutput ocr-direct.log -RedirectStandardError ocr-direct.err.log
          $ok = Finished $p 600 "ocrmypdf.exe on a scan"
          Get-Content ocr-direct.log, ocr-direct.err.log -ErrorAction SilentlyContinue | Select-Object -Last 15
          if (-not $ok -or $p.ExitCode -ne 0) { pwsh packaging/windows/annotate.ps1 ocr-direct.err.log "ocrmypdf.exe could not OCR a scan (exit $($p.ExitCode))"; exit 1 }

          $p = Start-Process -PassThru -FilePath "$app\KosmicPDF.exe" -ArgumentList "$env:RUNNER_TEMP\smoke-built"
          $ok = Finished $p 900 "the self-test in KosmicPDF.exe"
          if (Test-Path smoke-built.log) { Get-Content smoke-built.log | Select-Object -Last 3 }
          if (-not $ok) { pwsh packaging/windows/annotate.ps1 smoke-built.log "The self-test hung inside the built app; the log ends where it stopped"; exit 1 }
          if ($p.ExitCode -ne 0) { pwsh packaging/windows/annotate.ps1 smoke-built.log "The test suite failed inside the built app (exit $($p.ExitCode))"; exit 1 }

      - name: Installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DAppVersion=${{ steps.version.outputs.version }} packaging\windows\kosmicpdf.iss *> iscc.log
          $code = $LASTEXITCODE
          Get-Content iscc.log | Select-Object -Last 20
          if ($code -ne 0) { pwsh packaging/windows/annotate.ps1 iscc.log "Inno Setup failed"; exit 1 }
          Get-ChildItem dist\*.exe | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v5
        with:
          name: KosmicPDF-Setup-${{ steps.version.outputs.version }}
          path: dist/KosmicPDF-Setup-*.exe
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: logs
          path: "*.log"
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          python tools/release_notes.py $v > release-notes.md
          # An unversioned copy, so https://github.com/Kosmos-Law/pdf/releases/latest/download/KosmicPDF-Setup.exe always fetches the newest.
          Copy-Item "dist\KosmicPDF-Setup-$v.exe" dist\KosmicPDF-Setup.exe
          gh release create "${{ github.ref_name }}" --title "Kosmic PDF $v" --notes-file release-notes.md "dist\KosmicPDF-Setup-$v.exe" dist\KosmicPDF-Setup.exe
