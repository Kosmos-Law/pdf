# Flatpak build recipe for Kosmic PDF. Build and publish with tools/flatpak_publish.sh.
app-id: law.kosmos.KosmicPDF
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: kosmicpdf
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # A PDF editor opens and saves documents anywhere in the user's files.
  - --filesystem=home
  # Tesseract's built-in data path points at the build tree; tell it where the data is.
  - --env=TESSDATA_PREFIX=/app/share/tessdata
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/doc
  - '*.a'
  - '*.pyi'
  # Command-line helpers installed alongside the Python packages; the app uses none of them.
  - /bin/pyside6-*
  - /bin/ttx
  - /bin/pyft*
  - /bin/fonttools
  - /bin/pygmentize
  - /bin/markdown-it
  - /bin/img2pdf-gui
  # Kosmic PDF uses Qt Core, Gui, Widgets, Svg, Network and Test only. Drop Qt Quick,
  # QML, Designer and Qt's developer tools that PySide6_Essentials ships (~100 MB).
  - /lib/python3.13/site-packages/PySide6/Qt/qml
  - /lib/python3.13/site-packages/PySide6/Qt/metatypes
  - /lib/python3.13/site-packages/PySide6/Qt/translations
  - /lib/python3.13/site-packages/PySide6/Qt/plugins/qmltooling
  - /lib/python3.13/site-packages/PySide6/Qt/plugins/designer
  - /lib/python3.13/site-packages/PySide6/Qt/lib/libQt6Quick*
  - /lib/python3.13/site-packages/PySide6/Qt/lib/libQt6Qml*
  - /lib/python3.13/site-packages/PySide6/Qt/lib/libQt6Designer*
  - /lib/python3.13/site-packages/PySide6/Qt/lib/libQt6LabsStyleKit*
  - /lib/python3.13/site-packages/PySide6/QtQml*
  - /lib/python3.13/site-packages/PySide6/QtQuick*
  - /lib/python3.13/site-packages/PySide6/QtDesigner*
  - /lib/python3.13/site-packages/PySide6/assistant
  - /lib/python3.13/site-packages/PySide6/designer
  - /lib/python3.13/site-packages/PySide6/linguist
  - /lib/python3.13/site-packages/PySide6/lupdate
  - /lib/python3.13/site-packages/PySide6/lrelease
  - /lib/python3.13/site-packages/PySide6/qml*
  - /lib/python3.13/site-packages/PySide6/balsam*
  - /lib/python3.13/site-packages/PySide6/svgtoqml
  - /lib/python3.13/site-packages/PySide6/qsb
  # Leftovers that only served the parts removed above, Qt's database drivers, and
  # QtNetwork (unused; it needs Kerberos libraries the runtime doesn't have).
  - /lib/python3.13/site-packages/PySide6/Qt/lib/libQt6Labs*
  - /lib/python3.13/site-packages/PySide6/Qt/lib/libQt6Lottie*
  - /lib/python3.13/site-packages/PySide6/Qt/lib/libQt6Wayland*Compositor*
  - /lib/python3.13/site-packages/PySide6/Qt/lib/libQt6EglFsKmsGbmSupport*
  - /lib/python3.13/site-packages/PySide6/Qt/lib/libQt6VirtualKeyboard*
  - /lib/python3.13/site-packages/PySide6/Qt/lib/libQt6Network*
  - /lib/python3.13/site-packages/PySide6/QtNetwork*
  - /lib/python3.13/site-packages/PySide6/Qt/plugins/sqldrivers
  - /lib/python3.13/site-packages/PySide6/Qt/plugins/networkinformation
  - /lib/python3.13/site-packages/PySide6/Qt/plugins/tls
  - /lib/python3.13/site-packages/PySide6/Qt/plugins/imageformats/libqpdf.so
  - /lib/python3.13/site-packages/PySide6/Qt/plugins/platforminputcontexts/libqtvirtualkeyboard*
  - /lib/python3.13/site-packages/PySide6/Qt/plugins/egldeviceintegrations
  - /lib/python3.13/site-packages/PySide6/Qt/plugins/wayland-graphics-integration-server
  - /lib/python3.13/site-packages/PySide6/Qt/plugins/platforms/libqvnc.so
  - /lib/python3.13/site-packages/PySide6/Qt/plugins/vectorimageformats/libqlottievectorimage.so
  - /lib/python3.13/site-packages/PySide6/Qt/plugins/generic/libqtuiotouchplugin.so
  - /lib/python3.13/site-packages/PySide6/libpyside6qml*
  - /lib/python3.13/site-packages/PySide6/QtLabsStyleKit*
modules:
  # OCR engine. In the sandbox OCRmyPDF can't use the system's Tesseract.
  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_PROG=OFF
      - -DSW_BUILD=OFF
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.85.0/leptonica-1.85.0.tar.gz
        sha256: 3745ae3bf271a6801a2292eead83ac926e3a9bc1bf622e9cd4dd0f3786e17205

  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DGRAPHICS_DISABLED=ON
      - -DDISABLE_CURL=ON
      - -DDISABLE_ARCHIVE=ON
      - -DOPENMP_BUILD=OFF
      - -DSW_BUILD=OFF
      - -DCMAKE_INSTALL_LIBDIR=lib   # the sandbox doesn't search lib64
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.1.tar.gz
        sha256: a7a3f2a7420cb6a6a94d80c24163e183cf1d2f1bed2df3bbc397c81808a57237

  # English, plus orientation detection for "turn sideways pages".
  - name: tessdata
    buildsystem: simple
    build-commands:
      - install -Dm644 -t ${FLATPAK_DEST}/share/tessdata eng.traineddata osd.traineddata
    sources:
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/osd.traineddata
        sha256: 9cf5d576fcc47564f11265841e5ca839001e7e6f38ff7f7aacf46d15a96b00ff

  # PDF/A conversion. OCRmyPDF's internal PDF/A backend can only check files that are
  # already PDF/A, so it needs Ghostscript to convert. Built against the runtime's
  # image and font libraries rather than Ghostscript's bundled copies.
  - name: ghostscript
    buildsystem: autotools
    config-opts:
      - --disable-cups
      - --disable-gtk
      - --disable-dbus
      - --without-x
      - --without-libpaper
      - --without-tesseract
      - --with-system-libtiff
    sources:
      - type: archive
        url: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/ghostscript-10.08.0.tar.xz
        sha256: c20492bc8ebb96c87fa2e52a0926e1cda8cde95d66145e018ac713fed5da38cf
      - type: shell
        commands:
          - rm -rf freetype jpeg libpng zlib tiff openjpeg tesseract leptonica

  # Qt, PyMuPDF and OCRmyPDF wheels; generated by tools/flatpak_pip_sources.py.
  - python-deps.json

  - name: kosmicpdf
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/share/kosmicpdf
      - cp -r kosmicpdf ${FLATPAK_DEST}/share/kosmicpdf/
      # Precompiled, so Python doesn't recompile the app (in memory) at every launch.
      - python3 -m compileall -q --invalidation-mode checked-hash ${FLATPAK_DEST}/share/kosmicpdf/kosmicpdf
      - install -Dm755 packaging/flatpak/kosmicpdf-launcher.sh ${FLATPAK_DEST}/bin/kosmicpdf
      - sed -e 's|^Exec=.*|Exec=kosmicpdf %F|' -e 's|^Icon=.*|Icon=law.kosmos.KosmicPDF|' kosmicpdf.desktop
        > law.kosmos.KosmicPDF.desktop
      - install -Dm644 -t ${FLATPAK_DEST}/share/applications law.kosmos.KosmicPDF.desktop
      - for s in 16 24 32 48 64 128 256; do install -Dm644 kosmicpdf/icons/app/kosmicpdf-$s.png
        ${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/law.kosmos.KosmicPDF.png; done
      - install -Dm644 kosmicpdf/icons/app/kosmicpdf.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/law.kosmos.KosmicPDF.svg
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo packaging/flatpak/law.kosmos.KosmicPDF.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - .venv
          - .git
          - .flatpak-builder
          - kosmicpdf/__pycache__   # the host's bytecode; the build compiles its own
          - build-dir
          - repo
